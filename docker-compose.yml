version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: StrongPassword123
      POSTGRES_DB: musicbot_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d musicbot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - app/config.env
    environment:
      # Override for Docker networking (services talk via container names)
      DATABASE_URL: postgresql+asyncpg://botuser:StrongPassword123@postgres:5432/musicbot_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app/downloads:/workspace/app/downloads
      - ./app/sessions:/workspace/app/sessions
      - ./app/logs:/workspace/app/logs
    restart: unless-stopped

volumes:
  pgdata:
