name: CI Test Suite

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system audio dependencies (FFmpeg & Opus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0 libopus-dev

      - name: Verify FFmpeg installation
        run: |
          ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install --no-deps pyromod
          pip install "py-tgcalls[pyrogram]"
          pip install --no-deps --force-reinstall https://github.com/KurimuzonAkuma/pyrogram/archive/dev.zip
          pip install pytest pytest-asyncio aiosqlite fakeredis "python-socks[asyncio]" pysocks

      - name: Run light unit tests
        env:
          TEST_MODE: "1"
          DATABASE_URL: "sqlite+aiosqlite:///./.pytest-test-mode.db"
          REDIS_URL: "redis://localhost:6379/15"
          BOT_TOKEN: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
          API_ID: "12345"
          API_HASH: "0123456789abcdef0123456789abcdef"
          DEVELOPER_ID: "123456789"
          INSTANCE_ID: "test"
          PYTHONPATH: "."
        run: |
          pytest tests/unit/ -v
